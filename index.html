<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cadence</title>
    <meta name="description" content="A calm planner that keeps your tasks in your own Google Drive. Tasks, projects, habits, goals, focus and reviews." />
    <meta name="theme-color" content="#F7F5F0" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try { var t = localStorage.getItem("cadence:theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>
    <style>body{background:#F7F5F0}@media (prefers-color-scheme:dark){html:not([data-theme=light]) body{background:#111018}}html[data-theme=dark] body{background:#111018}</style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Cadence needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
